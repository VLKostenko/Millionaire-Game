name: Enforce PR Checklist for Dev

on:
  pull_request:
    branches:
      - dev

jobs:
  checklist:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Read required checklist items
        id: checklist
        run: |
          echo "items<<EOF" >> $GITHUB_OUTPUT
          cat .github/workflows/pr-checklist.md >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Check PR body for completed checklist items
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const isDraft = context.payload.pull_request.draft;
            if (isDraft) {
              core.info("📝 PR is in draft — skipping checklist validation");
              return;
            }

            const body = context.payload.pull_request.body || "";
            const checklistRaw = `${{ steps.checklist.outputs.items }}`;
            const requiredItems = checklistRaw
              .split("\n")
              .map(line => line.trim())
              .filter(line => line.startsWith("- [ ]") || line.startsWith("- [x]"));

            const uncheckedItems = requiredItems.filter(item => {
              const itemText = item.replace(/- \[[ xX]\]/, "").trim();
              const regex = new RegExp(`- \\[x\\]\\s*${itemText}`, "i");
              return !regex.test(body);
            });

            if (uncheckedItems.length > 0) {
              core.setFailed("❌ Not all checklist items are checked:\n" + uncheckedItems.join("\n"));
            }
