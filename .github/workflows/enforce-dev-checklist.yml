name: Enforce PR Checklist for Dev

on:
  pull_request:
    branches:
      - dev

jobs:
  checklist:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Read required checklist items
        id: checklist
        run: |
          echo "items<<EOF" >> $GITHUB_OUTPUT
          cat .github/pr-checklist.txt >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Check PR body
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const body = context.payload.pull_request.body || "";
            const checklistRaw = `${{ steps.checklist.outputs.items }}`;
            const required = checklistRaw.split("\n").filter(Boolean);
            const missing = required.filter(item => !body.includes(item));
            if (missing.length > 0) {
              core.setFailed("❌ PR checklist is missing required items:\n" + missing.join("\n"));
            }
