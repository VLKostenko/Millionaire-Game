name: Validate PR Checklist

on:
  pull_request:
    types: [opened, synchronize]
  workflow_dispatch:

jobs:
  validate-checklist:
    if: github.event.pull_request.base.ref == 'development'
    runs-on: ubuntu-latest

    steps:
      - name: Dump PR body
        id: dump_body
        run: |
          echo "BODY<<EOF" >> $GITHUB_OUTPUT
          echo "${{ github.event.pull_request.body }}" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Check for checklist marker
        run: |
          echo "🔍 Checking PR body for checklist..."
          echo "${{ steps.dump_body.outputs.BODY }}" | grep -q "Чеклист перед созданием PR" \
            && echo "✅ Checklist found." \
            || (echo "❌ Checklist not found. Please add the required checklist to the PR description." && exit 1)
