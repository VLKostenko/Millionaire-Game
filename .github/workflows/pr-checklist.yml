name: Validate PR Checklist

on:
  pull_request:
    types: [opened, edited, synchronize]

jobs:
  validate-checklist:
    if: github.event.pull_request.base.ref == 'dev'
    runs-on: ubuntu-latest

    steps:
      - name: Read PR body
        id: read_body
        run: |
          echo "BODY<<EOF" >> $GITHUB_OUTPUT
          echo "${{ github.event.pull_request.body }}" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Check for checklist
        run: |
          echo "🔍 Checking PR body for checklist marker..."
          echo "${{ steps.read_body.outputs.BODY }}" | grep -q "Чеклист перед созданием PR" \
            && echo "✅ Checklist found." \
            || (echo "❌ Checklist not found. Please include the required PR checklist." && exit 1)
