name: Inject PR Checklist into PR Body

on:
  pull_request:
    types: [opened, edited, synchronize]

jobs:
  inject-checklist:
    if: github.event.pull_request.base.ref == 'dev'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install GitHub CLI
        run: sudo apt-get install gh -y

      - name: Read PR body
        id: get_body
        run: |
          body=$(gh pr view ${{ github.event.pull_request.number }} --json body -q .body)
          echo "body<<EOF" >> $GITHUB_OUTPUT
          echo "$body" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check if checklist already exists
        id: check
        run: |
          echo "Checklist found: false" >> $GITHUB_STEP_SUMMARY
          echo "found=false" >> $GITHUB_OUTPUT
          if echo "${{ steps.get_body.outputs.body }}" | grep -q "Чеклист перед созданием PR"; then
            echo "Checklist found: true" >> $GITHUB_STEP_SUMMARY
            echo "found=true" >> $GITHUB_OUTPUT
          fi

      - name: Append checklist to PR
        if: steps.check.outputs.found == 'false'
        run: |
          pr_number="${{ github.event.pull_request.number }}"
          old_body="${{ steps.get_body.outputs.body }}"
          echo -e "$old_body\n\n$(cat .github/pull_request_template.md)" > full_body.md
          gh pr edit "$pr_number" --body-file full_body.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
