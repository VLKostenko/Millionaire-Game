name: Enforce PR Checklist for Dev

on:
  pull_request:
    branches:
      - dev

jobs:
  checklist:
    runs-on: ubuntu-latest
    steps:
      - name: Check PR body for checklist
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const body = context.payload.pull_request.body || "";
            const required = [
              "Проверил фичу локально",
              "Нет ошибок и предупреждений в консоли",
              "Удалил `console.log`, `debugger`, временные заглушки",
              "Код соответствует стандартам проекта (ESLint, Prettier)",
              "Описание задачи"
            ];
            const missing = required.filter(item => !body.includes(item));
            if (missing.length > 0) {
              core.setFailed("❌ PR checklist is missing required items:\\n" + missing.join("\\n"));
            }
