# .github/workflows/dev-pr-checklist.yml
name: Enforce PR Checklist for Dev

on:
  pull_request:
    branches:
      - dev

jobs:
  checklist:
    runs-on: ubuntu-latest
    steps:
      - name: Check PR body
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const body = context.payload.pull_request.body || ""
            const required = [
              "Проверил фичу локально",
              "Удалил `console.log`",
              "Код соответствует стандартам проекта",
              "Описание задачи"
            ];

            const missing = required.filter(item => !body.includes(item));

            if (missing.length > 0) {
              core.setFailed(`PR checklist is missing required items:\n${missing.join("\n")}`);
            }
